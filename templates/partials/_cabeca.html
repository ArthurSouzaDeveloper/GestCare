{# Cabeça compartilhada por base.html e base_publico.html.
   Um só lugar para fontes, tema, manifest e folha de estilo. #}
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="description" content="Sistema de gestão para instituições de cuidado">
  <meta name="theme-color" content="#eceeec" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0d1716" media="(prefers-color-scheme: dark)">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="GestCare">
  <link rel="manifest" href="{{ url_for('static', filename='manifest.json') }}">
  <link rel="icon" href="{{ url_for('static', filename='icons/favicon.ico') }}" sizes="48x48">
  <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='icons/favicon.svg') }}?v=2">
  <link rel="icon" type="image/png" sizes="32x32" href="{{ url_for('static', filename='icons/favicon-32.png') }}?v=2">
  <link rel="apple-touch-icon" href="{{ url_for('static', filename='icons/apple-touch-icon.png') }}?v=2">

  {# Tema antes da primeira pintura: sem flash ao carregar. #}
  <script>
    (function () {
      try {
        var t = localStorage.getItem('gestcare-tema');
        if (t === 'claro' || t === 'escuro') {
          document.documentElement.setAttribute('data-tema', t);
        }
      } catch (e) { /* armazenamento bloqueado: segue o tema do sistema */ }
    })();
  </script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  {# Equipe e páginas públicas: IBM Plex (direção A). Portal da família: Source Serif 4 + Source Sans 3 (direção B). #}
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&family=Source+Serif+4:opsz,wght@8..60,500;8..60,600&family=Source+Sans+3:wght@400;600;700&display=swap"
        rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}?v={{ versao_assets }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/direcoes.css') }}?v={{ versao_assets }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/portal.css') }}?v={{ versao_assets }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/entrada.css') }}?v={{ versao_assets }}">
