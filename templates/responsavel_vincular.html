{% extends "base_publico.html" %}
{% block titulo %}Acessar ficha do idoso{% endblock %}

{% block conteudo %}
<h1 class="titulo-pagina">Acessar ficha do idoso</h1>
<p class="subtitulo esp-y-6">
  Olá, {{ session.get('usuario_nome') }}! Informe o CPF ou RG do idoso que você acompanha.
</p>

<form method="POST">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <div class="form-grupo">
    <label class="form-label" for="cpf_rg">CPF ou RG do idoso</label>
    <input type="text" id="cpf_rg" name="cpf_rg" class="form-input" required autofocus
           placeholder="Digite o CPF ou RG do idoso">
  </div>
  <button type="submit" class="botao botao-primario botao-bloco">Acessar ficha</button>
</form>

<p class="publico-rodape"><a href="{{ url_for('logout') }}">Sair</a></p>
{% endblock %}
