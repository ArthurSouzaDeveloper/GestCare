{% extends "base.html" %}
{% block titulo %}Editar Casa{% endblock %}

{% block conteudo %}
<div class="fileira-entre esp-y-6">
  <div>
    <h1 class="titulo-pagina"><svg class="ti" aria-hidden="true"><use href="#ti-edit"/></svg> Editar Casa</h1>
    <p class="subtitulo">{{ casa.nome }}</p>
  </div>
  <a href="{{ url_for('listar_casas') }}" class="botao botao-secundario">← Voltar</a>
</div>

<div class="secao secao-estreita">
  <form method="POST">
    <div class="form-grupo">
      <label class="form-label" for="nome">Nome da Casa <span class="form-obrigatorio">*</span></label>
      <input type="text" id="nome" name="nome" class="form-input" required value="{{ casa.nome }}">
    </div>
    <div class="form-botoes esp-y-6">
      <button type="submit" class="botao botao-primario">Salvar</button>
      <a href="{{ url_for('listar_casas') }}" class="botao botao-secundario">Cancelar</a>
    </div>
  </form>
</div>
{% endblock %}
